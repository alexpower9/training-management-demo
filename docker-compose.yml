services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: nme_training
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - nme_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nme_training"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres-test:
    image: postgres:17
    environment:
      POSTGRES_DB: nme_training_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nme_training_test"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  nme_postgres_data:
